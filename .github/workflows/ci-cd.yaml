name: CI/CD DevSecOps

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

permissions: {}

env:
  IMAGE: devsecops-tp1-api:local
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  DIVE_IMAGE: wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  flake8:
    name: 1. Qualité applicative (Flake8)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Installation de Flake8
        run: pip install --no-cache-dir flake8==7.4.1

      - name: Audit Flake8 (fichier de configuration .flake8)
        run: flake8 --config .flake8 .

  hadolint:
    name: 2. Analyse statique conteneur (Hadolint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Hadolint (.hadolint.yaml)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work "$HADOLINT_IMAGE" \
            hadolint --config .hadolint.yaml Dockerfile

  build:
    name: 3. Build BuildKit multi-architecture (Bake) et métrologie des couches (Dive)
    needs: [flake8, hadolint]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Émulation QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Builder BuildKit (buildx)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Génération du jeton de build éphémère
        run: |
          mkdir -p secrets
          printf 'tok_%s' "$(openssl rand -hex 32)" > secrets/pip_token.txt
          echo "::add-mask::$(cat secrets/pip_token.txt)"

      - name: Build amd64 + arm64 via Bake (cache GHA importé et exporté en mode max)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: ci

      - name: Contrôle d'exécution de l'image arm64 (émulation QEMU)
        run: |
          docker image inspect -f '{{.Os}}/{{.Architecture}}' devsecops-tp1-api:arm64
          docker run --rm --platform linux/arm64 --entrypoint python devsecops-tp1-api:arm64 -c \
            "import platform, importlib.metadata as m, psycopg2; print(platform.machine(), 'flask', m.version('flask'), 'psycopg2', m.version('psycopg2-binary'))"

      - name: Contrôle d'étanchéité du jeton de build
        run: |
          TOKEN=$(cat secrets/pip_token.txt)
          FAIL=0
          for IMG in "$IMAGE" devsecops-tp1-api:arm64; do
            IN_HISTORY=$(docker history --no-trunc "$IMG" | grep -cF "$TOKEN" || true)
            IN_CONFIG=$(docker image inspect "$IMG" | grep -cF "$TOKEN" || true)
            CID=$(docker create "$IMG")
            IN_FS=$(docker export "$CID" | grep -caF "$TOKEN" || true)
            docker rm "$CID" > /dev/null
            echo "$IMG : historique=$IN_HISTORY configuration=$IN_CONFIG fichiers=$IN_FS"
            [ "$IN_HISTORY$IN_CONFIG$IN_FS" = "000" ] || { echo "::error::Jeton de build retrouvé dans $IMG"; FAIL=1; }
          done
          docker history --no-trunc "$IMAGE"
          rm -f secrets/pip_token.txt
          exit $FAIL

      - name: Export des images pour les jobs suivants
        run: |
          docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
          docker save devsecops-tp1-api:arm64 -o "$RUNNER_TEMP/image-arm64.tar"

      - name: Dive en mode CI (efficience minimale 80 %)
        run: |
          docker run --rm -e CI=true -v "$RUNNER_TEMP:/img" "$DIVE_IMAGE" \
            --ci --lowestEfficiency=0.8 --source docker-archive /img/image.tar

      - name: Archivage des images pour les jobs suivants
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/image-arm64.tar
          retention-days: 1

  security:
    name: 4. Sécurité supply chain (Trivy)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Récupération des images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Trivy - images produites amd64 et arm64 (HIGH/CRITICAL corrigibles = échec)
        run: |
          for TAR in image.tar image-arm64.tar; do
            echo "::group::$TAR"
            docker run --rm -v "$RUNNER_TEMP:/img" "$TRIVY_IMAGE" \
              image --input "/img/$TAR" --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
            echo "::endgroup::"
          done

      - name: Trivy - scanner de secrets (couches + configuration, règle du jeton interne)
        run: |
          for TAR in image.tar image-arm64.tar; do
            docker run --rm -v "$RUNNER_TEMP:/img" \
              -v "${{ github.workspace }}/trivy-secret.yaml:/cfg/trivy-secret.yaml:ro" "$TRIVY_IMAGE" \
              image --input "/img/$TAR" --scanners secret --image-config-scanners secret \
              --secret-config /cfg/trivy-secret.yaml --exit-code 1
          done

      - name: Trivy - image de la base de données (digest de docker-compose.yml)
        run: |
          DB_IMAGE=$(grep -oE 'cgr\.dev/chainguard/postgres@sha256:[0-9a-f]{64}' docker-compose.yml)
          echo "Image scannée : $DB_IMAGE"
          docker run --rm "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$DB_IMAGE"

      - name: Trivy - dépendances applicatives (requirements.txt)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work "$TRIVY_IMAGE" \
            fs --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 requirements.txt

  integration:
    name: 5. Intégration dynamique et smoke test
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Récupération de l'image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Chargement de l'image
        run: docker load -i "$RUNNER_TEMP/image.tar"

      - name: Génération d'un secret de base de données éphémère
        run: |
          # Mot de passe aléatoire propre à cette exécution : aucun secret statique dans le dépôt
          mkdir -p secrets
          openssl rand -hex 32 | tr -d '\r\n' > secrets/db_password.txt
          echo "::add-mask::$(cat secrets/db_password.txt)"
          # Lisible par les comptes non privilégiés des conteneurs (uid 70 et 65532)
          chmod 0444 secrets/db_password.txt

      - name: Contrôle de la composition (aucun secret en clair)
        run: |
          LEAKS=$(docker compose config --format json | jq -r '
            .services | to_entries[] | .key as $svc
            | (.value.environment // {}) | to_entries[]
            | select(.key | test("PASS|SECRET|TOKEN"; "i"))
            | select(.key | endswith("_FILE") | not)
            | "\($svc).\(.key)"')
          if [ -n "$LEAKS" ]; then
            echo "::error::Secret transmis en variable d'environnement : $LEAKS"
            exit 1
          fi
          echo "Aucun secret en clair : seuls des chemins *_FILE vers /run/secrets sont déclarés"

      - name: Lancement de la composition (attente de l'état sain, timeout 120 s)
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          docker compose ps

      - name: Contrôle du durcissement des conteneurs
        run: |
          FAIL=0
          for CID in $(docker compose ps -q); do
            NAME=$(docker inspect -f '{{.Name}}' "$CID")
            USER_ID=$(docker inspect -f '{{.Config.User}}' "$CID")
            READONLY=$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$CID")
            CAPDROP=$(docker inspect -f '{{.HostConfig.CapDrop}}' "$CID")
            SECOPT=$(docker inspect -f '{{.HostConfig.SecurityOpt}}' "$CID")
            ENVS=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$CID")
            echo "$NAME user=$USER_ID readonly=$READONLY capdrop=$CAPDROP secopt=$SECOPT"
            case "${USER_ID%%:*}" in ""|0|root) echo "::error::$NAME s'exécute en root"; FAIL=1 ;; esac
            [ "$READONLY" = "true" ] || { echo "::error::$NAME : système de fichiers inscriptible"; FAIL=1; }
            [[ "$CAPDROP" == *ALL* ]] || { echo "::error::$NAME : capacités Linux non supprimées"; FAIL=1; }
            [[ "$SECOPT" == *no-new-privileges:true* ]] || { echo "::error::$NAME : no-new-privileges absent"; FAIL=1; }
            if grep -iE '^[^=]*(PASS|SECRET|TOKEN)[^=]*=' <<< "$ENVS" | grep -vE '^[^=]*_FILE='; then
              echo "::error::$NAME : secret présent dans les variables d'environnement"; FAIL=1
            fi
          done
          exit $FAIL

      - name: Test de santé de l'API (/health)
        run: |
          RESPONSE=$(curl -fsS http://localhost:5000/health)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"'

      - name: Test de connexion à la base de données (/dbtest)
        run: |
          RESPONSE=$(curl -fsS http://localhost:5000/dbtest)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"db_connection":"successful"'

      - name: Tests pytest (dans le réseau de la composition)
        run: |
          docker compose run --rm --no-deps \
            -v "${{ github.workspace }}/test_app.py:/app/test_app.py:ro" \
            --entrypoint python api-python -m pytest -v -p no:cacheprovider test_app.py

      - name: Arrêt et purge des ressources
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -rf secrets

  release:
    name: 6. Distribution sécurisée multi-architecture (GHCR)
    needs: [flake8, hadolint, build, security, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Émulation QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Builder BuildKit (buildx)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Calcul des tags SemVer
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Connexion à GHCR (jeton natif du workflow)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Génération du jeton de build éphémère
        run: |
          mkdir -p secrets
          printf 'tok_%s' "$(openssl rand -hex 32)" > secrets/pip_token.txt
          echo "::add-mask::$(cat secrets/pip_token.txt)"

      - name: Publication de l'index amd64 + arm64 (Bake, couches reprises du cache validé)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: |
            docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-tags }}
            ${{ steps.meta.outputs.bake-file-labels }}
          targets: api
          push: true

      - name: Vérification de l'index multi-architecture publié
        env:
          REF: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
        run: |
          REF="${REF,,}"
          docker buildx imagetools inspect "$REF"
          PLATFORMS=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"')
          for P in linux/amd64 linux/arm64; do
            grep -qx "$P" <<< "$PLATFORMS" || { echo "::error::Plateforme $P absente de l'index publié"; exit 1; }
          done
          echo "Index publié : ${PLATFORMS//$'\n'/, }"
