# Durcissement système commun aux deux conteneurs
x-hardening: &hardening
  read_only: true                 # système de fichiers racine en lecture seule
  cap_drop: [ALL]                 # aucune capacité Linux (aucun des deux services n'en a besoin)
  security_opt:
    - no-new-privileges:true      # interdit toute élévation de privilèges (setuid, setgid)
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"             # rotation des journaux : pas de saturation du disque hôte
      max-file: "3"

services:
  api-python:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - pip_token
    image: devsecops-tp1-api:local
    user: "65532:65532"           # compte nonroot de l'image Chainguard, imposé aussi côté orchestration
    ports:
      - "127.0.0.1:5000:5000"     # exposé uniquement sur la boucle locale de l'hôte
    environment:
      ENV: test
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD_FILE: /run/secrets/db_password   # chemin du secret, jamais sa valeur
    secrets:
      - db_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    deploy:
      resources:
        limits:
          pids: 128
          cpus: "0.50"
          memory: 256M
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    <<: *hardening
    image: cgr.dev/chainguard/postgres@sha256:b32c0efe4c15bbc08fcd801f619a7d98d44f3f8eca3ec89efad4941a56e8741c
    # L'image démarre en root (chown + gosu) : on la lance directement sous le compte postgres (uid 70)
    user: "70:70"
    environment:
      POSTGRES_USER: testuser
      POSTGRES_DB: testdb
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # Monté sur le parent de PGDATA, qui appartient à postgres : le volume hérite de ce propriétaire
      - pgdata:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0775,size=1m
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    deploy:
      resources:
        limits:
          pids: 128
          cpus: "1.00"
          memory: 512M
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "testuser", "-d", "testdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

secrets:
  db_password:
    # Fichier local non versionné (voir .gitignore) ; généré aléatoirement à chaque exécution en CI
    file: ./secrets/db_password.txt
  pip_token:
    file: ./secrets/pip_token.txt

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true                # pas de route vers l'extérieur : la base est injoignable hors de la stack

volumes:
  pgdata:
